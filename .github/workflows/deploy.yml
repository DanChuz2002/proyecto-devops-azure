name: CI/CD Azure Docker Swarm

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-devops-azure:latest .

      - name: Prueba básica del contenedor
        run: |
          docker run -d -p 5000:5000 --name test-app ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-devops-azure:latest
          sleep 10
          curl -f http://localhost:5000/health
          docker stop test-app
          docker rm test-app

      - name: Escaneo de vulnerabilidades con Trivy
        run: |
          docker run --rm aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-devops-azure:latest

      - name: Subir imagen a Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-devops-azure:latest

      - name: Copiar archivos de despliegue a Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "docker-stack.yml,monitoring/prometheus.yml"
          target: "/home/${{ secrets.AZURE_USER }}/"

      - name: Desplegar en Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-devops-azure:latest
            docker stack deploy -c /home/${{ secrets.AZURE_USER }}/docker-stack.yml proyecto
            docker service update --force proyecto_web